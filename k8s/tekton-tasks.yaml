# Tekton Tasks（4 个 stage 对应 V 模型阶段）
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: unit-test
  namespace: vmodel-pipeline
  annotations:
    vmodel.stage: "unit_test"
    vmodel.req: "REQ-101"
spec:
  description: "单元测试（V 模型左下 → 单元测试）"
  params:
    - name: repo-url
      type: string
      description: "demo 服务 git 仓库 URL"
  workspaces:
    - name: source
  steps:
    - name: checkout
      image: alpine/git:v2.45
      workingDir: $(workspaces.source.path)
      script: |
        git clone $(params.repo-url) .
    - name: pytest-unit
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/services
      script: |
        pip install -e . pytest pytest-asyncio
        pytest tests/unit -v --junitxml=results-unit.xml
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: integration-test
  namespace: vmodel-pipeline
  annotations:
    vmodel.stage: "integration_test"
    vmodel.req: "REQ-102"
spec:
  description: "集成测试（V 模型左中 → 集成测试，docker compose 起依赖）"
  workspaces:
    - name: source
  steps:
    - name: compose-up
      image: docker/compose:1.29
      workingDir: $(workspaces.source.path)/services
      script: |
        docker compose up -d postgres redis
        sleep 10
    - name: pytest-integration
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/services
      script: |
        pip install -e . pytest pytest-asyncio httpx
        pytest tests/integration -v --junitxml=results-integration.xml
    - name: compose-down
      image: docker/compose:1.29
      workingDir: $(workspaces.source.path)/services
      script: |
        docker compose down
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: system-test
  namespace: vmodel-pipeline
  annotations:
    vmodel.stage: "system_test"
    vmodel.req: "REQ-103"
spec:
  description: "系统测试（V 模型右下 → 系统测试，k6 负载）"
  params:
    - name: target-url
      type: string
      description: "staging 服务 URL"
  steps:
    - name: k6-load
      image: grafana/k6:latest
      script: |
        k6 run --vus 10 --duration 30s - <<EOF
        import http from 'k6/http';
        export const options = { thresholds: {
          http_req_duration: ['p(99)<2000'],
          http_reqs: ['rate>=10'],
        }};
        export default function() {
          http.post('$(params.target-url)', JSON.stringify({q: 'ping'}));
        }
        EOF
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: acceptance-test
  namespace: vmodel-pipeline
  annotations:
    vmodel.stage: "acceptance_test"
    vmodel.req: "REQ-104"
spec:
  description: "验收测试（V 模型右下 → 验收测试，端到端含真实 LLM）"
  params:
    - name: target-url
      type: string
  workspaces:
    - name: source
  steps:
    - name: pytest-acceptance
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/services
      script: |
        pip install -e . pytest pytest-asyncio httpx
        export TARGET_URL=$(params.target-url)
        pytest tests/acceptance -v --junitxml=results-acceptance.xml
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: meta-ci
  namespace: vmodel-pipeline
  annotations:
    vmodel.stage: "meta_ci"
    vmodel.req: "REQ-201,REQ-202"
spec:
  description: "meta CI：检查 pipeline YAML 本身是否含全部 4 stage（REQ-201）"
  params:
    - name: config-path
      type: string
      default: "k8s/tekton-pipeline.yaml"
  workspaces:
    - name: source
  steps:
    - name: check-stages
      image: alpine:3.19
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        CONFIG=$(params.config-path)
        echo "🔍 meta CI: 检查 $CONFIG"
        for stage in unit-test integration-test system-test acceptance-test; do
          if ! grep -q "$stage" "$CONFIG"; then
            echo "❌ Missing stage: $stage"
            exit 1
          fi
          echo "✅ Found: $stage"
        done
        echo "✅ meta CI: 全部 4 stage 都存在"
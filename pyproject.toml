[project]
name = "vmodel-pipeline"
version = "0.1.0"
description = "V Model + CI/CD Pipeline Lab (本地 k3d + Tekton + Argo CD + LLM 解读)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vmodel-pipeline = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]